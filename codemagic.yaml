workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
      gradle: 8.4
    scripts:
      - name: Build Android App
        script: |
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
