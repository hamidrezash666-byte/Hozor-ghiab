workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Android App
        script: |
          gradle assembleDebug -Dorg.gradle.java.home=$JAVA_HOME --warning-mode none
    artifacts:
      - app/build/outputs/apk/**/*.apk
